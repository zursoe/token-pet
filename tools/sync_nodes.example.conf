# Token-Pet remote agent-data mirror nodes
# Copy this file to ~/.config/tokenpet/sync_nodes.conf and edit for your machines.
# (The real config file is intentionally NOT committed to the repository.)

# Linux nodes that run standard SSH + tailscale/any reachable network:
#   "user@host|label|tools"
#   tools: comma separated, one or more of: codex,claude,kimi,opencode
SYNC_LINUX_NODES=(
  "user@node1|node1|codex,claude,kimi,opencode"
  "user@node2|node2|codex"
)

# Optional: a node that runs a WSL distribution (WSL2 host machine).
#   "user@host|wsl_label|windows_label"
# - wsl_label    : mirror label for the Linux-side data
# - windows_label: mirror label for the Windows-side data read via /mnt/c
#                  (leave the third field empty to skip the Windows side)
SYNC_WSL_NODE="user@wslhost|wslnode|winlabel"
